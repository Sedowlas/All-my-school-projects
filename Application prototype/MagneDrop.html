<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MagneDrop</title>
<style>
:root{
  --bg:#0f1720; --surface:#17232f; --surface2:#1e2e3d; --border:#2a3c4d;
  --text:#eaf1f8; --dim:#7d8ba0; --blue:#66c0f4; --blue2:#1a9fff;
  --grad:linear-gradient(135deg,#1a9fff,#66c0f4);
  --green:#a4d007; --greendark:#4c6b22;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
html,body{height:100%;background:#05080c;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;padding:24px 0;min-height:100vh}
.phone{width:390px;max-width:94vw;height:812px;max-height:90vh;background:var(--bg);border-radius:36px;
  border:8px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;color:var(--text);font-weight:600}
.status .right{display:flex;align-items:center;gap:5px;color:var(--text)}
.status svg{display:block}
#screen{flex:1;overflow-y:auto;padding:0 18px 90px;-webkit-overflow-scrolling:touch}
#screen::-webkit-scrollbar{display:none}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{color:var(--blue)}
h1{font-size:22px;font-weight:700;margin:6px 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.field{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 14px;
  color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
.field:focus{border-color:var(--blue)}
.field::placeholder{color:var(--dim)}
.btn{width:100%;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn-primary{background:var(--grad);color:#04202f}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost{background:var(--surface);color:var(--text)}
.link{color:var(--blue);text-align:center;font-size:13px;cursor:pointer;margin-top:4px}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:14px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.social{display:flex;gap:8px;margin-bottom:14px}
.social div{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px;text-align:center;font-size:12px;cursor:pointer;color:var(--dim)}
.social div:hover{color:var(--text);border-color:var(--blue)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}
.iconbtn{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:16px;color:var(--dim)}
.searchbar svg{width:17px;height:17px;flex:0 0 auto}
.searchbar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px}
.section-title{font-size:13px;font-weight:700;color:var(--dim);margin:16px 0 10px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.card-feat{flex:0 0 208px;height:118px;border-radius:10px;position:relative;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;background-size:cover;background-position:center}
.card-feat::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
.card-feat .cf-title{position:relative;z-index:1;font-weight:700;font-size:13px;line-height:1.25}
.card-feat .cf-plat{position:relative;z-index:1;font-size:10.5px;color:#b9c6d4;margin-bottom:2px}
.discribbon{position:absolute;top:8px;left:8px;z-index:2;background:var(--greendark);color:var(--green);font-weight:700;font-size:11px;padding:3px 7px;border-radius:4px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;cursor:pointer}
.thumb{width:54px;height:54px;border-radius:6px;flex:0 0 auto;background-size:cover;background-position:center}
.rowbody{flex:1;min-width:0}
.rowtitle{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.platform{font-size:11px;color:var(--dim);margin-top:2px}
.pricewrap{display:flex;align-items:center;gap:6px;margin-top:5px}
.price{font-weight:700;font-size:13px}
.orig{color:var(--dim);font-size:11px;text-decoration:line-through}
.badge{font-size:10.5px;font-weight:700;background:var(--greendark);color:var(--green);border-radius:4px;padding:2px 6px;flex:0 0 auto}
.heart{width:17px;height:17px;cursor:pointer;flex:0 0 auto;color:var(--dim)}
.heart.on{color:var(--blue)}
.navbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:14px;z-index:3}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--dim);font-size:10.5px}
.navitem.active{color:var(--blue)}
.navicon{width:21px;height:21px}
.cover{width:100%;height:210px;border-radius:12px;margin:8px 0 14px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.cover .tag{position:absolute;top:10px;left:10px;background:var(--greendark);color:var(--green);font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px}
.gplat{font-size:12px;color:var(--dim);margin-bottom:4px}
.gtitle{font-size:19px;font-weight:800;margin-bottom:8px}
.price-box{display:flex;align-items:stretch;background:var(--surface2);border-radius:6px;overflow:hidden;margin-bottom:12px;width:fit-content}
.disc-pct{background:var(--greendark);color:var(--green);font-weight:700;font-size:15px;padding:9px 10px;display:flex;align-items:center}
.price-nums{padding:6px 12px;text-align:right}
.price-nums .orig{display:block;font-size:11px}
.price-nums .final{display:block;color:var(--green);font-weight:700;font-size:15px}
.price-plain{font-size:19px;font-weight:800;margin-bottom:12px}
.timer{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;color:var(--dim);text-align:center;margin-bottom:10px}
.about{font-size:13px;color:var(--dim);line-height:1.6;margin-top:4px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#04202f;font-weight:800;font-size:20px;flex:0 0 auto}
.profhead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:var(--dim)}
.menu{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.menuitem{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px}
.menuitem:last-child{border-bottom:none}
.menuitem svg{width:19px;height:19px;color:var(--dim);flex:0 0 auto}
.menuitem span{flex:1}
.menuitem .chev{width:16px;height:16px;color:var(--dim);flex:0 0 auto}
.empty{text-align:center;padding:60px 10px;color:var(--dim)}
.empty svg{width:34px;height:34px;margin-bottom:10px;color:var(--border)}
.toggle{width:40px;height:22px;border-radius:20px;background:var(--surface2);position:relative;cursor:pointer;border:1px solid var(--border);flex:0 0 auto}
.toggle .dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.toggle.on{background:var(--blue2)}
.toggle.on .dot{left:20px;background:#04202f}
.toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:#1e2e3d;border:1px solid var(--border);
  padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:9;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;bottom:106px}
.headrow{display:flex;align-items:center;gap:10px;padding:10px 0 14px;position:sticky;top:0;background:var(--bg)}
.headrow h1{margin:0}

/* Readability / typography polish */
html,body{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
*{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.logo{font-size:22px;letter-spacing:-.025em}
h1{font-size:24px;line-height:1.2}
.sub{font-size:14px;line-height:1.45}
.field{font-size:15.5px;padding:14px 15px;border-radius:10px;min-height:48px}
.btn{font-size:15px;padding:14px;min-height:48px;border-radius:10px}
.link{font-size:14px}
.divider{font-size:13px}
.social div{font-size:13px;padding:12px;border-radius:10px}
.section-title{font-size:14px}
.rowtitle{font-size:14.5px}
.platform{font-size:12px}
.price{font-size:14px}
.orig{font-size:12px}
.badge{font-size:11px}
.navitem{font-size:11.5px}
.gplat{font-size:13px}
.gtitle{font-size:21px}
.about{font-size:14px;line-height:1.65}
.menuitem{font-size:14.5px}
.stat span{font-size:12px}
.toast{font-size:13.5px}
.searchbar input{font-size:15px}

/* Cart & checkout */
.cart-count{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blue2);color:#04131d;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cart-btn{position:relative}
.cart-item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.cart-item .thumb{width:58px;height:58px}
.qty{display:flex;align-items:center;gap:7px;margin-top:7px}
.qty button{width:24px;height:24px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:6px;cursor:pointer}
.qty span{min-width:16px;text-align:center;font-size:12px}
.remove{color:var(--dim);font-size:11px;cursor:pointer;margin-top:5px}
.summary{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;margin-top:14px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:7px 0;color:var(--dim)}
.sumrow.total{padding-top:9px;margin-top:9px;border-top:1px solid var(--border);color:var(--text);font-weight:800;font-size:15px}
.checkout-step{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--dim);font-size:11px}
.checkout-step b{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#04202f}
.checkout-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:12px}
.checkout-card h3{font-size:14px;margin-bottom:10px}
.delivery{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.delivery .check{color:var(--green);font-weight:800}
.success{text-align:center;padding:35px 8px}
.success .checkmark{width:58px;height:58px;border-radius:50%;background:var(--greendark);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 14px}
.order-code{background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:11px;margin:14px 0;font-size:12px}

</style>
</head>

let screen='login', stack=[], tab='home', gameId=null, infoData=null;
let wishlist=new Set(['witcher3']);
let cart={};
let lastOrder=null;

function $(s){return document.getElementById(s)}
function nav(s){if(['account','profile','cart','checkout'].includes(s)&&!currentUser){screen='login';stack=[];render();toast('Please log in first');return}stack.push(screen);screen=s;render()}
function back(){screen=stack.pop()||tab;render()}
function setTab(t){if(!currentUser){screen='login';stack=[];render();toast('Please log in first');return}tab=t;screen=t;stack=[];render()}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1700)}
function toggleWish(id,e){
  if(e)e.stopPropagation();
  wishlist.has(id)?wishlist.delete(id):wishlist.add(id);
  toast(wishlist.has(id)?'Added to Wishlist':'Removed from Wishlist');render()
}
function openGame(id){gameId=id;nav('game')}
function openInfo(title,body){infoData={title,body};nav('info')}

function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function cartItems(){return Object.entries(cart).map(([id,qty])=>({g:games.find(x=>x.id===id),qty})).filter(x=>x.g)}
function cartSubtotal(){return cartItems().reduce((sum,{g,qty})=>sum+g.price*qty,0)}
function cartAdd(id,qty=1){
  cart[id]=(cart[id]||0)+qty;
  toast('Added to cart');
  render();
}
function cartRemove(id){
  delete cart[id];
  toast('Removed from cart');
  render();
}
function cartQty(id,delta){
  cart[id]=Math.max(0,(cart[id]||0)+delta);
  if(!cart[id]) delete cart[id];
  render();
}
function clearCart(){cart={};render()}

function priceRow(g){
  return `<div class="pricewrap">${g.orig?`<span class="orig">$${g.orig.toFixed(2)}</span>`:''}<span class="price">$${g.price.toFixed(2)}</span>${g.disc?`<span class="badge">SALE -${g.disc}%</span>`:''}</div>`;
}
function gameRow(g){
  const on=wishlist.has(g.id);
  return `<div class="row" onclick="openGame('${g.id}')">
    <div class="thumb" style="background-image:url('${g.img}')"></div>
    <div class="rowbody"><div class="rowtitle">${g.title}</div><div class="platform">${g.plat}</div>${priceRow(g)}</div>
    <div class="heart ${on?'on':''}" onclick="toggleWish('${g.id}',event)">${on?ICON.heartOn:ICON.heart}</div>
  </div>`;
}
function cartButton(){
  const n=cartCount();
  return `<div class="iconbtn cart-btn" onclick="nav('cart')" aria-label="Cart">${ICON.cart}${n?`<span class="cart-count">${n>99?'99+':n}</span>`:''}</div>`;
}
function headBar(title,withBack=true){
  return `<div class="headrow">${withBack?`<div class="iconbtn" onclick="back()">${ICON.back}</div>`:''}<h1 style="font-size:18px">${title}</h1>${withBack&&screen!=='cart'&&screen!=='checkout'&&screen!=='success'?`<div style="margin-left:auto">${cartButton()}</div>`:''}</div>`;
}


// Local demo authentication: accounts are stored in this browser only.
let currentUser=null;
let resetEmail='';
let resetCode='';
function loadAuth(){
  try{ currentUser=JSON.parse(localStorage.getItem('md_currentUser')||'null'); }catch(e){currentUser=null}
}
function getAccounts(){try{return JSON.parse(localStorage.getItem('md_accounts')||'[]')}catch(e){return[]}}
function saveAccounts(a){localStorage.setItem('md_accounts',JSON.stringify(a))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}
function passwordOk(p){return typeof p==='string'&&p.length>=6}
function loginUser(){
  const email=($('loginEmail')?.value||'').trim().toLowerCase(), pass=$('loginPass')?.value||'';
  const a=getAccounts(), u=a.find(x=>x.email===email);
  if(!validEmail(email)){toast('Enter a valid email');return}
  if(!u||u.password!==pass){toast('Wrong email or password');return}
  currentUser={name:u.name,email:u.email}; localStorage.setItem('md_currentUser',JSON.stringify(currentUser));
  tab='home';screen='home';stack=[];render();toast('Welcome back, '+u.name+'!')
}
function createAccount(){
  const name=($('regName')?.value||'').trim(), email=($('regEmail')?.value||'').trim().toLowerCase(), pass=$('regPass')?.value||'', confirm=$('regConfirm')?.value||'';
  if(name.length<2){toast('Enter your name');return}
  if(!validEmail(email)){toast('Enter a valid email');return}
  if(!passwordOk(pass)){toast('Password must be at least 6 characters');return}
  if(pass!==confirm){toast('Passwords do not match');return}
  const a=getAccounts(); if(a.some(x=>x.email===email)){toast('Account already exists');return}
  a.push({name,email,password:pass}); saveAccounts(a);
  currentUser={name,email}; localStorage.setItem('md_currentUser',JSON.stringify(currentUser));
  tab='home';screen='home';stack=[];render();toast('Account created successfully')
}
function beginReset(){
  const email=($('fpEmail')?.value||'').trim().toLowerCase(), a=getAccounts(), u=a.find(x=>x.email===email);
  if(!validEmail(email)||!u){toast('Account with this email was not found');return}
  resetEmail=email; resetCode=String(Math.floor(100000+Math.random()*900000));
  screen='resetVerify';stack.push('forgot');render();
  setTimeout(()=>toast('Demo reset code: '+resetCode),100);
}
function verifyReset(){
  const code=($('resetCode')?.value||'').trim(); if(code!==resetCode){toast('Invalid reset code');return}
  screen='resetPassword';render()
}
function finishReset(){
  const p=$('newPass')?.value||'', c=$('newPass2')?.value||'';
  if(!passwordOk(p)){toast('Password must be at least 6 characters');return}
  if(p!==c){toast('Passwords do not match');return}
  const a=getAccounts(), u=a.find(x=>x.email===resetEmail); if(!u){toast('Account not found');return}
  u.password=p; saveAccounts(a); resetCode=''; resetEmail=''; screen='login';stack=[];render();toast('Password changed. Please log in')
}
function updateAccount(){
  if(!currentUser){screen='login';render();return}
  const name=($('accName')?.value||'').trim(), email=($('accEmail')?.value||'').trim().toLowerCase();
  if(name.length<2){toast('Enter your name');return}
  if(!validEmail(email)){toast('Enter a valid email');return}
  const a=getAccounts(), u=a.find(x=>x.email===currentUser.email); if(!u){toast('Account not found');return}
  if(email!==currentUser.email&&a.some(x=>x.email===email)){toast('Email is already in use');return}
  u.name=name;u.email=email;saveAccounts(a);currentUser={name,email};localStorage.setItem('md_currentUser',JSON.stringify(currentUser));render();toast('Account updated')
}
function changePassword(){
  if(!currentUser)return;
  const old=$('oldPass')?.value||'', p=$('changePass')?.value||'', c=$('changePass2')?.value||'', a=getAccounts(),u=a.find(x=>x.email===currentUser.email);
  if(!u||u.password!==old){toast('Current password is incorrect');return}
  if(!passwordOk(p)){toast('New password must be at least 6 characters');return}
  if(p!==c){toast('Passwords do not match');return}
  u.password=p;saveAccounts(a);render();toast('Password changed successfully')
}

function placeOrder(){
  if(!cartCount()){toast('Your cart is empty');return}
  const total=cartSubtotal();
  lastOrder={code:'MD-'+Math.floor(100000+Math.random()*900000),email:'player@magnedrop.gg',total};
  cart={};screen='success';stack=[];render();toast('Payment successful');
}

const TABS=['home','search','wishlist','profile'];
function render(){
  $('screen').innerHTML=screens();
  $('screen').scrollTop=0;
  const showNav=TABS.includes(tab)&&TABS.includes(screen)||['game','notif','notifSettings','info','cart'].includes(screen);
  $('navbar').style.display=showNav?'flex':'none';
  $('navbar').innerHTML=showNav?`
    <div class="navitem ${tab==='home'?'active':''}" onclick="setTab('home')"><span class="navicon">${ICON.home}</span>Home</div>
    <div class="navitem ${tab==='search'?'active':''}" onclick="setTab('search')"><span class="navicon">${ICON.search}</span>Search</div>
    <div class="navitem ${tab==='wishlist'?'active':''}" onclick="setTab('wishlist')"><span class="navicon">${tab==='wishlist'?ICON.heartOn:ICON.heart}</span>Wishlist</div>
    <div class="navitem ${screen==='cart'?'active':''}" onclick="nav('cart')"><span class="navicon">${ICON.cart}</span>Cart${cartCount()?` (${cartCount()})`:''}</div>
    <div class="navitem ${tab==='profile'?'active':''}" onclick="setTab('profile')"><span class="navicon">${ICON.user}</span>Profile</div>`:'';
}
render();

</script>
</body>
</html>
